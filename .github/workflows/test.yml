name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version-policy:
    name: version-policy
    runs-on: ubuntu-latest

    # Check the entire change series, NOT only the most recent commit.
    # A failed job makes the Test workflow fail and prevents WinterBot's
    # existing CI-gated nightly update from deploying the commit.
    env:
      VERSION_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18.20.8
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Reject manual WinterBot version changes
        run: node scripts/checkVersionPolicy.js

  test:
    needs: version-policy
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.20.8
          - 24

    env:
      VERSION_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (includes version policy)
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
